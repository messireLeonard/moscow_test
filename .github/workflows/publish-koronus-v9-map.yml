name: Publish Koronus V9 map package
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-koronus-v9-map.yml]
permissions:
  contents: write
concurrency:
  group: publish-koronus-v9-map
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble and validate map-only release
        run: |
          python3 - <<'PY'
          import json,base64,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED,ZipInfo
          payload=json.loads(Path('koronus/v9/map-payload.json').read_text())
          assert payload['sourceCommit']=='a7bce8b0c0a007f7e0702ca86e0cfa3c0ce997af'
          files={k:base64.b64decode(v,validate=False) for k,v in payload['files'].items()}
          assert len(files)==15
          for name in files:
              assert name.startswith('data/') and '..' not in Path(name).parts
              assert name.endswith(('.json','.geojson','.kml','.pmtiles'))
          city=json.loads(files['data/city-packages/koronus.json'])['cities'][0]
          pm=files[city['bundledPath']]
          assert len(pm)==city['expectedBytes']==1501
          assert hashlib.sha256(pm).hexdigest()==city['expectedSha256']
          assert pm.startswith(b'PMTiles')
          expected={city['bundledPath'],'data/city-packages/koronus.json','data/city-markers/koronus-screaming-vortex-v8.geojson','data/map-packages/koronus/vortex.json',city['seedKml']['path'],*city['seedKml']['additionalPaths']}
          assert set(files)==expected
          resource=json.loads(files['data/map-packages/koronus/vortex.json'])
          assert resource['schemaVersion']==1 and resource['regionMinZoom']==5
          assert len(resource['regionAnchors'])==3 and resource['field']['bodySvg']
          assert len(resource['phenomenonAnchors'])==2
          sites=json.loads(files['data/city-markers/koronus-screaming-vortex-v8.geojson'])['features']
          assert len(sites)==46 and len({s['id'] for s in sites})==46
          names={s['properties']['name'] for s in sites}
          assert {'Dwimmer','Berin','Kymerus','Mamon','Redemption (Screaming Vortex)','Pyurultide','Anathema'} <= names
          assert not {'Dymmer','Beren','Nuragus','Mammon'} & names
          for name,data in files.items():
              if name.endswith('.kml'): ET.fromstring(data)
          vortex=ET.fromstring(files['data/city-markers/koronus-screaming-vortex-v8.kml'])
          assert len(vortex.findall('.//{*}Placemark'))==45
          assert any('13th' in (p.findtext('{*}name') or '') for n,b in files.items() if n.endswith('.kml') for p in ET.fromstring(b).findall('.//{*}Placemark'))
          provenance={'sourceCommit':payload['sourceCommit'],'scope':'Koronus map data only','requiresRuntime':'ICM PR #498 from the source commit; procedural storm and regional lettering are NOT contained in PMTiles','foundryRuntime':'NOT VERIFIED','files':[{'path':n,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for n,b in sorted(files.items())]}
          files['PROVENANCE.json']=(json.dumps(provenance,ensure_ascii=False,indent=2)+'\n').encode()
          files['README.txt']=('Koronus V9 map data only. No Foundry module included.\nContains PMTiles base and all 11 KML files: systems, areas, routes and 46 Screaming Vortex records (44 destinations and two currents).\nRequires matching ICM PR #498 runtime for the procedural storm, x6 parallax, close-up details and region labels at zoom >=5. Authored geometry, palette, placement and labels are now data/map-packages/koronus/vortex.json; GLSL remains in ICM. Install the data tree under Data/modules/interactive-city-map/ and reload clients.\nThe PMTiles base remains unchanged. Updating only this map archive does not install the V9 shader.\nExisting scene IDs must be preserved: use the idempotent Vortex installer already supplied with ICM PR #498 for adding sites. Do not blindly reimport all KML into an existing campaign.\nHistorical V9 catalogue replay currently has a JS checkpoint hash mismatch; this map-only release has been independently checked by exact data hashes and KML parsing. Foundry runtime is not verified.\n').encode()
          out=Path('release');out.mkdir()
          (out/'koronus.pmtiles').write_bytes(pm)
          (out/'PROVENANCE.json').write_bytes(files['PROVENANCE.json'])
          with ZipFile(out/'koronus-v9-map.zip','w',ZIP_DEFLATED,compresslevel=9) as z:
              for name,data in sorted(files.items()):
                  info=ZipInfo('koronus-v9/'+name,date_time=(2026,10,30,0,0,0));info.compress_type=ZIP_DEFLATED
                  z.writestr(info,data)
          with ZipFile(out/'koronus-v9-map.zip') as z:
              assert z.testzip() is None
              assert len(z.namelist())==17
              assert not any(n.endswith(('.mjs','module.json')) for n in z.namelist())
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())))
          print((out/'SHA256SUMS.txt').read_text())
          PY
      - name: Publish map release after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=koronus-v9-locations-20261030
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          Обновлённый Коронус: полный пакет данных карты, без Foundry-модуля.
          
          - koronus-v9-map.zip: PMTiles и все 11 KML с системами, регионами, маршрутами и 46 записями Screaming Vortex.
          - koronus.pmtiles: подложка отдельно.
          - PROVENANCE.json и SHA256SUMS.txt: происхождение и контрольные суммы.
          
          Требуется ICM PR #498 (исходник a7bce8b0c0a007f7e0702ca86e0cfa3c0ce997af) для процедурного шторма, параллакса x6, деталей крупного плана и надписей регионов с zoom 5. Эти функции находятся в коде ICM и не встроены в PMTiles; архив карты не обновляет модуль. Добавлен vortex.json: форма, маски, профиль, палитра, привязка, подписи и порог zoom 5. Для чтения ресурса требуется совместимость из PR #498.
          
          Добавлены восемь мест исходной карты; исправлены Dwimmer, Berin, Kymerus и Mamon. Harrowed Space и Ascendant Spiral отображаются как надписи течений. Для старой сцены: установить совместимый PR-код и данные, Ctrl+F5, затем повторно запустить существующий Install-Screaming-Vortex-v8. Он добавит восемь мест с сохранением прежних IDs и пользовательских правок. Штатные скрытые подписи восстановлены; явно настроенные группы сохраняются.

          Проверены SHA256 и размер PMTiles, XML всех KML, 45 KML-записей и существующая 13th Station, CRC ZIP и отсутствие модуля в архиве. Историческая проверка каталога V9 выявила несовпадение JS checkpoint; воспроизводимость этого каталога не заявляется. Foundry runtime не проверен.
          EOF
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Koronus V9 — map data package" --notes-file release-notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
